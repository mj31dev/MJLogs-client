config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    # An MVI intent dispatcher is a single exhaustive `when` over a sealed hierarchy: its branch
    # count is a property of the contract, not accidental complexity.
    ignoreSingleWhenExpression: true
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 10
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 10
  ComplexCondition:
    active: true
    allowedConditions: 4
  LargeClass:
    active: true
    allowedLines: 400
  LongMethod:
    active: true
    allowedLines: 60

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true

formatting:
  active: true
  autoCorrect: true
  ArgumentListWrapping:
    active: true
  ParameterListWrapping:
    active: true
  TrailingCommaOnCallSite:
    active: true
  TrailingCommaOnDeclarationSite:
    active: true

naming:
  active: true
  PackageNaming:
    active: true
    packagePattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']
    # Backtick test names are allowed in every test source set, including the JVM specific one.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/desktopTest/**']

style:
  active: true
  UnusedImport:
    active: true
  ReturnCount:
    active: true
    max: 3
    # Guard clauses are the idiomatic way to express preconditions in Kotlin.
    excludeGuardClauses: true
  MagicNumber:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/desktopTest/**']
  WildcardImport:
    active: true
    excludeImports: ['java.util.*', 'kotlinx.coroutines.*']
  MaxLineLength:
    active: true
    maxLineLength: 140
