config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 10
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 10
  ComplexCondition:
    active: true
    allowedConditions: 4
  LargeClass:
    active: true
    allowedLines: 400
  LongMethod:
    active: true
    allowedLines: 60

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true

formatting:
  active: true
  autoCorrect: true
  ArgumentListWrapping:
    active: true
  ParameterListWrapping:
    active: true
  TrailingCommaOnCallSite:
    active: true
  TrailingCommaOnDeclarationSite:
    active: true

naming:
  active: true
  PackageNaming:
    active: true
    packagePattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']

style:
  active: true
  UnusedImport:
    active: true
  WildcardImport:
    active: true
    excludeImports: ['java.util.*', 'kotlinx.coroutines.*']
  MaxLineLength:
    active: true
    maxLineLength: 140
